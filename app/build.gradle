plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}
android {
    namespace 'com.unified.ereader'
    compileSdk 34
    defaultConfig {
        applicationId "com.unified.ereader"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0-Unified"
    }
    signingConfigs {
        fixedSign {
            storeFile file("boox_keystore.jks")
            storePassword "123456"
            keyAlias "booxkey"
            keyPassword "123456"
        }
    }
    buildTypes {
        debug { signingConfig signingConfigs.fixedSign }
        release { signingConfig signingConfigs.fixedSign; minifyEnabled false }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }
    packaging {
        resources {
            excludes += ['META-INF/DEPENDENCIES', 'META-INF/LICENSE', 'META-INF/NOTICE']
        }
    }
}
dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.tom-roush:pdfbox-android:2.0.27.0'
    implementation 'com.google.mlkit:text-recognition:16.0.0'
    implementation 'com.google.android.gms:play-services-auth:21.0.0'
}
